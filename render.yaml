# Render Blueprint Specification for The Downloader
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. PO Token Provider (BgUtil HTTP server for YouTube bot bypass)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-pot-provider
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.pot-provider
    dockerContext: .
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: "4416"

  # ---------------------------------------------------------------------------
  # 2. Backend API & Media Processing Engine (FastAPI + Stream Engine + POT)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-api
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOWNLOAD_DIR
        value: /tmp/media-downloader
      - key: DOWNLOAD_EXPIRY_SECONDS
        value: "3600"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: ALLOWED_ORIGINS
        value: https://www.downloader.biz,https://downloader.biz
      - key: PO_TOKEN_PROVIDER_URL
        fromService:
          type: web
          name: the-downloader-pot-provider
          property: hostport
      - key: YOUTUBE_PO_TOKEN
        value: "" # Optional: Direct PO Token (e.g. web.player+<token>)
      - key: YOUTUBE_VISITOR_DATA
        value: "" # Optional: Direct visitor data associated with PO Token
      - key: YOUTUBE_COOKIES
        value: "" # Optional: Fallback authentication cookies (Netscape format or base64 encoded)
      - key: YOUTUBE_COOKIES_FILE
        value: "" # Optional: Path to cookie file on disk
      - key: YOUTUBE_PROXY_URL
        value: "" # Optional: Residential / SOCKS5 / HTTP Proxy (e.g. http://user:pass@proxy.example.com:8080)
      - key: YT_DLP_UPDATE_CHANNEL
        value: "stable" # Optional: yt-dlp release channel
      - key: YOUTUBE_CLIENTS
        value: "android,visionos,web,mweb" # Player client list (PO tokens auto-generated by bgutil provider)

  # ---------------------------------------------------------------------------
  # 3. Frontend Web Application (Next.js 15 App Router)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-web
    runtime: node
    plan: free
    region: oregon
    rootDir: front-end
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: the-downloader-api
          property: host
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: the-downloader-api
          property: host
