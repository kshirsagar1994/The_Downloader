# Render Blueprint Specification for The Downloader
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API & Media Processing Engine (FastAPI + Stream Engine + Embedded POT)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-api
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOWNLOAD_DIR
        value: /tmp/media-downloader
      - key: DOWNLOAD_EXPIRY_SECONDS
        value: "3600"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: ALLOWED_ORIGINS
        value: https://www.downloader.biz,https://downloader.biz
      - key: PO_TOKEN_PROVIDER_URL
        value: "http://127.0.0.1:4416" # Embedded in-container BgUtil PO Token daemon (loopback)
      - key: POT_PROVIDER_PORT
        value: "4416"
      - key: YOUTUBE_PO_TOKEN
        value: "" # Optional: Direct PO Token (e.g. web.player+<token>)
      - key: YOUTUBE_VISITOR_DATA
        value: "" # Optional: Direct visitor data associated with PO Token
      - key: YOUTUBE_COOKIES
        value: "" # Optional: Fallback authentication cookies (Netscape format or base64 encoded)
      - key: YOUTUBE_COOKIES_FILE
        value: "" # Optional: Path to cookie file on disk
      - key: YOUTUBE_PROXY_URL
        value: "" # Optional: Residential / SOCKS5 / HTTP Proxy (e.g. http://user:pass@proxy.example.com:8080)
      - key: YT_DLP_UPDATE_CHANNEL
        value: "stable" # Optional: yt-dlp release channel
      - key: YOUTUBE_CLIENTS
        value: "visionos,android,tv,mweb,ios,web" # Bot-resilient cloud extraction order

  # ---------------------------------------------------------------------------
  # 3. Frontend Web Application (Next.js 15 App Router)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-web
    runtime: node
    plan: free
    region: oregon
    rootDir: front-end
    buildCommand: npm install && npm run build
    startCommand: npx serve out -l $PORT -s
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: the-downloader-api
          property: host
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: the-downloader-api
          property: host
