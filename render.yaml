# Render Blueprint Specification for The Downloader
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API & Media Processing Engine (FastAPI + Stream Engine + Embedded POT)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-api
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOWNLOAD_DIR
        value: /tmp/media-downloader
      - key: DOWNLOAD_EXPIRY_SECONDS
        value: "3600"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: ALLOWED_ORIGINS
        value: https://www.downloader.biz,https://downloader.biz

      # ============================================================================
      # CRITICAL: YouTube on Cloud Hosting (Render, Heroku, etc.) REQUIRES one of:
      #   1. YOUTUBE_COOKIES - Export cookies from authenticated browser session (Netscape format or base64)
      #   2. YOUTUBE_PROXY_URL - Residential proxy (e.g. http://user:pass@proxy.example.com:8080)
      # Without these, YouTube's BotGuard will block ALL extraction attempts from cloud IPs.
      # See: https://github.com/yt-dlp/yt-dlp/wiki/FAQ#how-do-i-pass-cookies-to-yt-dlp
      # ============================================================================
      # QUICK SETUP: Run locally to get cookies:
      #   pip install browser-cookie3
      #   python scripts/export_youtube_cookies.py --browser chrome --format base64
      # Then paste the output as YOUTUBE_COOKIES value below
      # ============================================================================
      - key: YOUTUBE_COOKIES
        value: "" # REQUIRED for YouTube on cloud: base64-encoded Netscape cookies from your browser
      - key: YOUTUBE_COOKIES_FILE
        value: "" # Optional: Path to cookie file on disk (alternative to YOUTUBE_COOKIES)
      - key: YOUTUBE_PROXY_URL
        value: "" # ALTERNATIVE: Residential/SOCKS5/HTTP proxy for YouTube (e.g. http://user:pass@host:port)

      # Embedded PO Token Provider (runs in-container on loopback)
      # Note: Tokens generated here are tied to the Render IP and may be rejected by YouTube's BotGuard.
      # For reliable YouTube extraction, configure YOUTUBE_COOKIES or YOUTUBE_PROXY_URL above.
      - key: PO_TOKEN_PROVIDER_URL
        value: "http://127.0.0.1:4416"
      - key: POT_PROVIDER_PORT
        value: "4416"
      - key: YOUTUBE_PO_TOKEN
        value: "" # Optional: Direct PO Token (e.g. web.player+<token>)
      - key: YOUTUBE_VISITOR_DATA
        value: "" # Optional: Direct visitor data associated with PO Token
      - key: YT_DLP_UPDATE_CHANNEL
        value: "stable"
      - key: YOUTUBE_CLIENTS
        value: "visionos,android,tv,mweb,ios,web"

      # Diagnostic endpoints (no auth required):
      #   GET /api/health/youtube - Overall YouTube extraction status
      #   GET /api/health/youtube/cookies - Validates your YOUTUBE_COOKIES work

  # ---------------------------------------------------------------------------
  # 3. Frontend Web Application (Next.js 15 App Router)
  # ---------------------------------------------------------------------------
  - type: web
    name: the-downloader-web
    runtime: node
    plan: free
    region: oregon
    rootDir: front-end
    buildCommand: npm install && npm run build
    startCommand: npx serve out -l $PORT -s
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: the-downloader-api
          property: host
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: the-downloader-api
          property: host
