services:
  redis:
    image: redis:7.2.16-alpine
    container_name: media_downloader_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: media_downloader_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - DOWNLOAD_DIR=/tmp/media-downloader
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - media_storage:/tmp/media-downloader
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: media_downloader_worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DOWNLOAD_DIR=/tmp/media-downloader
    volumes:
      - media_storage:/tmp/media-downloader
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: media_downloader_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: media_downloader_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  redis_data:
  media_storage:
